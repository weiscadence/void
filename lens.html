<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOID.EXE — the lens</title>
<!--
  THE LENS — learning the canvasui technique, not lifting it.
  canvasui.dev's whole trick, under every component, is one move: take live content, put it in
  a texture, distort the texture in a fragment shader. So this hand-rolls exactly that, on-brand,
  with GLSL I wrote rather than a dropped-in component:
    1. paint the drain wordmark + sigils onto an offscreen 2D canvas (deterministic, no DOM-capture
       dependency, so I can reason about it without a browser to watch)
    2. upload that canvas as a WebGL texture
    3. a cursor-following glass droplet refracts it — inward magnify + chromatic dispersion + an
       idle ripple so it breathes without a cursor. "a drop of the drain."
  Robust by design: no WebGL → the flat 2D canvas still shows (never a black/broken page).
  Author could not launch a browser in-container, so this is built defensively and flagged for
  an eyes-on check.
-->
<style>
  html,body{ margin:0; height:100%; background:#07070a; overflow:hidden;
    font:13px/1.5 ui-monospace,Menlo,monospace; color:#5a5f6e; }
  #gl,#flat{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #flat{ display:none; }             /* fallback surface, shown only if WebGL fails */
  .tag{ position:fixed; left:0; right:0; bottom:16px; text-align:center; font-size:10.5px;
    letter-spacing:.28em; color:#5a5f6e; z-index:3; pointer-events:none; }
  .tag a{ color:#a855f7; text-decoration:none; pointer-events:auto; }
  .hint{ position:fixed; top:16px; left:0; right:0; text-align:center; font-size:10.5px;
    letter-spacing:.24em; color:#4a4f5e; z-index:3; pointer-events:none; }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="flat"></canvas>
  <div class="hint" id="hint">MOVE THE CURSOR · A DROP OF THE DRAIN</div>
  <div class="tag">VOID 〰️ · THE LENS · hand-rolled shader, learned not lifted ·
    <a href="/void">synthesis</a> · <a href="/void/silica">silica</a></div>

<script>
(function(){
  const PURPLE = '#a855f7', GREEN = '#00ff88', DIM = '#6b7180';
  const glc = document.getElementById('gl');
  const flat = document.getElementById('flat');
  const hint = document.getElementById('hint');
  let W, H, DPR;

  // ── 1. paint on-brand content to an offscreen 2D canvas (the "live content") ───────────────
  const src = document.createElement('canvas');
  const sx = src.getContext('2d');
  function paintSource(){
    src.width = W; src.height = H;
    sx.fillStyle = '#07070a'; sx.fillRect(0,0,W,H);
    const cx = W/2, cy = H/2, min = Math.min(W,H);

    // faint concentric rings — a drain seen from above
    for (let r = min*0.08; r < min*0.62; r += min*0.06){
      sx.beginPath(); sx.arc(cx, cy, r, 0, Math.PI*2);
      sx.strokeStyle = 'rgba(168,85,247,0.10)'; sx.lineWidth = 1; sx.stroke();
    }
    // a ring of esoteric glyphs
    const glyphs = '✦ ◇ 〰 ▽ ✧ ◈ 〜 ▼ ⟁ ◆ ∴ ⬡'.split(' ');
    sx.font = `${Math.round(min*0.028)}px ui-monospace, Menlo, monospace`;
    sx.textAlign = 'center'; sx.textBaseline = 'middle';
    const R = min*0.40;
    for (let i=0;i<glyphs.length;i++){
      const a = (i/glyphs.length)*Math.PI*2 - Math.PI/2;
      sx.fillStyle = i%2 ? 'rgba(0,255,136,0.55)' : 'rgba(168,85,247,0.6)';
      sx.fillText(glyphs[i], cx + Math.cos(a)*R, cy + Math.sin(a)*R);
    }
    // wordmark
    sx.font = `700 ${Math.round(min*0.13)}px ui-monospace, Menlo, monospace`;
    const grad = sx.createLinearGradient(cx-min*0.3, 0, cx+min*0.3, 0);
    grad.addColorStop(0, PURPLE); grad.addColorStop(1, GREEN);
    sx.fillStyle = grad;
    sx.fillText('DRAIN', cx, cy - min*0.02);
    // tagline
    sx.font = `${Math.round(min*0.022)}px ui-monospace, Menlo, monospace`;
    sx.fillStyle = 'rgba(230,232,238,0.72)';
    sx.fillText('we don’t pump. we drain the poison out.', cx, cy + min*0.11);
  }

  // ── 2 + 3. WebGL: upload as texture, refract in a fragment shader ──────────────────────────
  const VERT = `attribute vec2 p; varying vec2 uv;
    void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;
  // cursor-following droplet: inward magnify near the lens, chromatic split, + idle ripple.
  const FRAG = `precision highp float;
    varying vec2 uv;
    uniform sampler2D tex; uniform vec2 res; uniform vec2 mouse; uniform float time;
    void main(){
      vec2 asp = vec2(res.x/res.y, 1.0);
      vec2 p = uv * asp;
      vec2 m = mouse * asp;
      float d = distance(p, m);
      float R = 0.26;                                   // lens radius
      vec2 dir = d > 0.0001 ? normalize(p - m) : vec2(0.0);

      // idle breathing ripple across the whole field (alive without a cursor)
      float ripple = sin(d*26.0 - time*1.6) * 0.0016 * smoothstep(0.9,0.0,d);
      vec2 disp = dir * ripple;

      float rim = 0.0;
      if (d < R){
        float t = 1.0 - d/R;                            // 1 at centre → 0 at edge
        float bulge = t*t*0.14;                         // magnify: pull samples inward
        disp -= dir * bulge;
        rim = smoothstep(0.82,1.0,d/R) * (1.0-d/R);     // bright ring near the lens edge
      }

      // chromatic dispersion — sample the three channels at slightly different offsets
      vec2 u = uv;                                      // uv already 0..1 aligned to texture
      float r = texture2D(tex, u + disp*1.04).r;
      float g = texture2D(tex, u + disp*1.00).g;
      float b = texture2D(tex, u + disp*0.96).b;
      vec3 col = vec3(r,g,b);
      col += vec3(0.66,0.33,1.0) * rim * 0.5;           // purple-white droplet rim
      gl_FragColor = vec4(col, 1.0);
    }`;

  function compile(gl, type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
    return s;
  }

  let gl, prog, tex, uRes, uMouse, uTime, raf;
  const mouse = { x: 0.5, y: 0.5 };

  function initGL(){
    gl = glc.getContext('webgl') || glc.getContext('experimental-webgl');
    if (!gl) return false;
    const vs = compile(gl, gl.VERTEX_SHADER, VERT);
    const fs = compile(gl, gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) return false;
    prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return false; }
    gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW); // fullscreen tri
    const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    uRes = gl.getUniformLocation(prog, 'res');
    uMouse = gl.getUniformLocation(prog, 'mouse');
    uTime = gl.getUniformLocation(prog, 'time');
    return true;
  }

  function uploadTexture(){
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);       // canvas is y-down; flip to match uv
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.floor(innerWidth * DPR); H = Math.floor(innerHeight * DPR);
    paintSource();
    if (gl){
      glc.width = W; glc.height = H;
      gl.viewport(0,0,W,H);
      uploadTexture();
    } else {
      flat.width = W; flat.height = H;
      flat.getContext('2d').drawImage(src, 0, 0);
    }
  }

  function fallback(){
    glc.style.display = 'none'; flat.style.display = 'block';
    hint.textContent = 'WEBGL UNAVAILABLE — SHOWING THE FLAT SIGIL';
    flat.width = W; flat.height = H; flat.getContext('2d').drawImage(src, 0, 0);
  }

  function loop(t){
    gl.uniform2f(uRes, W, H);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.uniform1f(uTime, t*0.001);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    raf = requestAnimationFrame(loop);
  }

  function setMouse(cx, cy){ mouse.x = cx/innerWidth; mouse.y = 1.0 - cy/innerHeight; }
  addEventListener('mousemove', e => setMouse(e.clientX, e.clientY));
  addEventListener('touchmove', e => { const t=e.touches[0]; if(t) setMouse(t.clientX, t.clientY); }, {passive:true});
  addEventListener('resize', resize);

  // boot
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.floor(innerWidth * DPR); H = Math.floor(innerHeight * DPR);
  paintSource();
  if (initGL()){ resize(); requestAnimationFrame(loop); }
  else fallback();
})();
</script>
</body>
</html>
